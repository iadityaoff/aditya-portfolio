<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ev-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F2"/>
      <stop offset="100%" stop-color="#F0ECE4"/>
    </linearGradient>
    <filter id="ev-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0E0E10" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Tinted Panel -->
  <rect width="800" height="500" fill="url(#ev-bg)"/>

  <!-- Desktop Registration Canvas -->
  <g transform="translate(60, 45)" filter="url(#ev-shadow)">
    <rect width="680" height="410" rx="16" fill="#FFFFFF" stroke="#E7E5DF" stroke-width="1"/>
    
    <!-- Top System Header -->
    <rect width="680" height="44" rx="16" fill="#FAFAF7"/>
    <path d="M0 28 Q0 44 16 44 L664 44 Q680 44 680 28 L680 44 L0 44 Z" fill="#FAFAF7"/>
    <line x1="0" y1="44" x2="680" y2="44" stroke="#E7E5DF" stroke-width="1"/>
    
    <circle cx="28" cy="22" r="5" fill="#FF5F56"/>
    <circle cx="44" cy="22" r="5" fill="#FFBD2E"/>
    <circle cx="60" cy="22" r="5" fill="#27C93F"/>
    
    <text x="340" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#5F5F68">Global Summit 2026 / Attendee Pass Registration</text>

    <!-- 10-Minute Cart Hold Sticky Banner -->
    <g transform="translate(24, 56)">
      <rect width="632" height="32" rx="6" fill="#2F4BFF" opacity="0.08" stroke="#2F4BFF" stroke-width="1"/>
      <circle cx="20" cy="16" r="4" fill="#2F4BFF"/>
      <text x="32" y="20" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#2F4BFF">TICKETS RESERVED</text>
      <text x="160" y="20" font-family="-apple-system, sans-serif" font-size="10" fill="#0E0E10">Your pass is held for: <tspan font-family="monospace" font-weight="700" fill="#2F4BFF">09:42</tspan> to complete workshop selection</text>
    </g>

    <!-- Main Stepper & Form -->
    <g transform="translate(24, 102)">
      <!-- Left Step Progress Bar (width: 170) -->
      <rect width="170" height="284" rx="8" fill="#FAFAF7" stroke="#E7E5DF" stroke-width="1"/>
      <text x="16" y="24" font-family="monospace" font-size="9" font-weight="700" fill="#5F5F68">REGISTRATION STEPS</text>

      <g transform="translate(16, 40)">
        <!-- Step 1 (Done) -->
        <circle cx="10" cy="10" r="10" fill="#10B981"/>
        <text x="10" y="14" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#FFFFFF">✓</text>
        <text x="28" y="14" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#0E0E10">Ticket Tier (VIP)</text>
        <line x1="10" y1="22" x2="10" y2="46" stroke="#10B981" stroke-width="1.5"/>

        <!-- Step 2 (Active) -->
        <circle cx="10" cy="56" r="10" fill="#2F4BFF"/>
        <text x="10" y="60" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#FFFFFF">2</text>
        <text x="28" y="60" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#2F4BFF">Attendee Details</text>
        <line x1="10" y1="68" x2="10" y2="92" stroke="#E7E5DF" stroke-width="1.5"/>

        <!-- Step 3 (Conditional) -->
        <circle cx="10" cy="102" r="10" fill="#FFFFFF" stroke="#E7E5DF" stroke-width="1.5"/>
        <text x="10" y="106" text-anchor="middle" font-family="monospace" font-size="9" font-weight="600" fill="#5F5F68">3</text>
        <text x="28" y="106" font-family="-apple-system, sans-serif" font-size="10" fill="#5F5F68">VIP Accommodations</text>
        <line x1="10" y1="114" x2="10" y2="138" stroke="#E7E5DF" stroke-width="1.5"/>

        <!-- Step 4 -->
        <circle cx="10" cy="148" r="10" fill="#FFFFFF" stroke="#E7E5DF" stroke-width="1.5"/>
        <text x="10" y="152" text-anchor="middle" font-family="monospace" font-size="9" font-weight="600" fill="#5F5F68">4</text>
        <text x="28" y="152" font-family="-apple-system, sans-serif" font-size="10" fill="#5F5F68">Review &amp; Pay</text>
      </g>

      <!-- Center Form Fields (width: 290) -->
      <g transform="translate(186, 0)">
        <rect width="290" height="284" rx="8" fill="#FFFFFF" stroke="#E7E5DF" stroke-width="1"/>
        <text x="20" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0E0E10">VIP Attendee Information</text>
        <text x="20" y="44" font-family="-apple-system, sans-serif" font-size="10" fill="#5F5F68">Customized questions based on your Executive Pass selection</text>

        <!-- Form Field 1 -->
        <text x="20" y="74" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#5F5F68">FULL NAME</text>
        <rect x="20" y="80" width="250" height="30" rx="5" fill="#FAFAF7" stroke="#E7E5DF" stroke-width="1"/>
        <text x="30" y="100" font-family="-apple-system, sans-serif" font-size="10" fill="#0E0E10">David Chen</text>

        <!-- Form Field 2 -->
        <text x="20" y="126" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#5F5F68">COMPANY &amp; TITLE</text>
        <rect x="20" y="132" width="250" height="30" rx="5" fill="#FAFAF7" stroke="#E7E5DF" stroke-width="1"/>
        <text x="30" y="152" font-family="-apple-system, sans-serif" font-size="10" fill="#0E0E10">Converge AI, VP of Product</text>

        <!-- Conditional Question Branch Banner -->
        <rect x="20" y="174" width="250" height="42" rx="6" fill="#2F4BFF" opacity="0.06" stroke="#2F4BFF" stroke-width="1"/>
        <text x="30" y="192" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#2F4BFF">BRANCH LOGIC ACTIVE</text>
        <text x="30" y="206" font-family="-apple-system, sans-serif" font-size="9" fill="#0E0E10">3 VIP breakout dinner sessions unlocked</text>

        <!-- Submit Button -->
        <rect x="20" y="234" width="250" height="34" rx="6" fill="#2F4BFF"/>
        <text x="145" y="255" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Continue to Breakouts →</text>
      </g>

      <!-- Right Pass Preview (width: 140) -->
      <g transform="translate(490, 0)">
        <rect width="142" height="284" rx="8" fill="#FAFAF7" stroke="#E7E5DF" stroke-width="1"/>
        <!-- Badge Card Preview -->
        <rect x="12" y="16" width="118" height="180" rx="8" fill="#0B0B0F" stroke="#23232C" stroke-width="1"/>
        <rect x="12" y="16" width="118" height="24" rx="8" fill="#2F4BFF"/>
        <text x="71" y="32" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" fill="#FFFFFF">VIP ALL-ACCESS</text>
        
        <circle cx="71" cy="68" r="18" fill="#FFFFFF" opacity="0.1"/>
        <text x="71" y="104" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">David Chen</text>
        <text x="71" y="118" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#8E8EA0">Converge AI</text>

        <!-- QR Code Simulation -->
        <rect x="46" y="132" width="50" height="50" rx="4" fill="#FFFFFF"/>
        <rect x="52" y="138" width="14" height="14" fill="#000000"/>
        <rect x="76" y="138" width="14" height="14" fill="#000000"/>
        <rect x="52" y="162" width="14" height="14" fill="#000000"/>
        <rect x="72" y="158" width="8" height="8" fill="#000000"/>

        <text x="71" y="218" text-anchor="middle" font-family="monospace" font-size="8" font-weight="600" fill="#5F5F68">FAST-TRACK QR</text>
        <text x="71" y="232" text-anchor="middle" font-family="monospace" font-size="8" fill="#10B981">4.2s Check-In</text>
      </g>
    </g>
  </g>
</svg>
