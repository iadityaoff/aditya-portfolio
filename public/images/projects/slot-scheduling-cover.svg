<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#F3F7F5"/>
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="16" fill="#FFFFFF" stroke="#E7E5DF" stroke-width="1"/>
    <!-- Header -->
    <rect width="680" height="44" rx="16" fill="#FAFAF7"/>
    <line x1="0" y1="44" x2="680" y2="44" stroke="#E7E5DF"/>
    <circle cx="28" cy="22" r="5" fill="#FF5F56"/>
    <circle cx="44" cy="22" r="5" fill="#FFBD2E"/>
    <circle cx="60" cy="22" r="5" fill="#27C93F"/>
    <text x="340" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#5F5F68">Slot Scheduling Engine / Multi-Resource Calendar</text>

    <!-- Calendar View with Dynamic Buffer blocks -->
    <g transform="translate(30, 64)">
      <!-- Day Headers -->
      <g font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#0E0E10">
        <text x="50" y="20">Mon 14</text>
        <text x="170" y="20">Tue 15</text>
        <text x="290" y="20">Wed 16</text>
        <text x="410" y="20">Thu 17</text>
        <text x="530" y="20">Fri 18</text>
      </g>
      <line x1="0" y1="32" x2="620" y2="32" stroke="#E7E5DF"/>

      <!-- Slots and Buffers -->
      <!-- Mon Slot -->
      <rect x="30" y="50" width="100" height="60" rx="6" fill="#2F4BFF"/>
      <text x="80" y="78" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">10:00 — 11:00 AM</text>
      <text x="80" y="94" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#FFFFFF" opacity="0.8">Dr. Vance (Cardiology)</text>
      <!-- Auto Buffer Strip -->
      <rect x="30" y="114" width="100" height="18" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-dasharray="2 2"/>
      <text x="80" y="127" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" fill="#B45309">15m Travel Buffer</text>

      <!-- Tue Slot -->
      <rect x="150" y="80" width="100" height="60" rx="6" fill="#0E0E10"/>
      <text x="200" y="108" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">02:00 — 03:00 PM</text>
      <text x="200" y="124" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#FFFFFF" opacity="0.8">Dr. Reynolds</text>

      <!-- Wed Slot with conflict solved -->
      <rect x="270" y="50" width="100" height="60" rx="6" fill="#2F4BFF"/>
      <text x="320" y="78" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">11:30 — 12:30 PM</text>
      <text x="320" y="94" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#FFFFFF" opacity="0.8">Telehealth Consult</text>

      <!-- Timezone Badge Bottom Right -->
      <g transform="translate(420, 260)">
        <rect width="190" height="34" rx="6" fill="#FAFAF7" stroke="#E7E5DF"/>
        <circle cx="20" cy="17" r="4" fill="#10B981"/>
        <text x="32" y="21" font-family="monospace" font-size="10" fill="#0E0E10">UTC-5 (EST) / Auto-Sync</text>
      </g>
    </g>
  </g>
</svg>
